<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de Auditoría 360</title>
  <desc id="desc">Flujo entre navegador React, contextos, repositorios demo y Supabase.</desc>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#162033} .title{font-size:28px;font-weight:800}.label{font-size:18px;font-weight:700}.small{font-size:14px}.box{stroke:#d9e2ef;stroke-width:2}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Auditoría 360 · arquitectura actual</text>
  <text x="60" y="86" class="small">Una interfaz común separa presentación, reglas de acceso y persistencia.</text>
  <rect x="60" y="140" width="300" height="360" rx="24" fill="#fff" class="box"/>
  <text x="90" y="185" class="label">Navegador React</text>
  <rect x="90" y="215" width="240" height="58" rx="14" fill="#eef2ff" class="box"/><text x="210" y="250" text-anchor="middle" class="small">Rutas y páginas</text>
  <rect x="90" y="290" width="240" height="58" rx="14" fill="#ecfeff" class="box"/><text x="210" y="325" text-anchor="middle" class="small">AuthContext · DataContext</text>
  <rect x="90" y="365" width="240" height="58" rx="14" fill="#fff7ed" class="box"/><text x="210" y="400" text-anchor="middle" class="small">Permisos y validaciones</text>
  <rect x="90" y="440" width="240" height="34" rx="10" fill="#f1f5f9"/><text x="210" y="462" text-anchor="middle" class="small">Demo / Supabase</text>
  <path d="M360 320h120" class="line"/>
  <rect x="480" y="185" width="260" height="270" rx="24" fill="#fff" class="box"/>
  <text x="610" y="230" text-anchor="middle" class="label">Contrato de repositorio</text>
  <rect x="515" y="260" width="190" height="58" rx="14" fill="#dcfce7" class="box"/><text x="610" y="295" text-anchor="middle" class="small">CRUD y consultas</text>
  <rect x="515" y="335" width="190" height="58" rx="14" fill="#fef3c7" class="box"/><text x="610" y="370" text-anchor="middle" class="small">Aprobación y trazabilidad</text>
  <path d="M740 290h110M740 390h110" class="line"/>
  <rect x="850" y="140" width="290" height="155" rx="24" fill="#fff7ed" class="box"/>
  <text x="995" y="180" text-anchor="middle" class="label">Modo demo</text>
  <text x="995" y="220" text-anchor="middle" class="small">localStorage · IndexedDB</text>
  <text x="995" y="250" text-anchor="middle" class="small">datos precargados y sesión local</text>
  <rect x="850" y="345" width="290" height="155" rx="24" fill="#eff6ff" class="box"/>
  <text x="995" y="385" text-anchor="middle" class="label">Modo Supabase</text>
  <text x="995" y="425" text-anchor="middle" class="small">Auth · PostgREST · RPC</text>
  <text x="995" y="455" text-anchor="middle" class="small">PostgreSQL · RLS · triggers</text>
  <text x="60" y="570" class="small">Nota: el módulo de facturas negociables está implementado y validado en demo; la paridad Supabase queda documentada como trabajo posterior.</text>
</svg>
